name: Update Crestview schedule

on:
  schedule:
    - cron: "17 9 * * *"   # daily, ~4 AM Austin
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python build_schedule.py
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add crestview.json
          git diff --cached --quiet || git commit -m "Update Crestview schedule"
          git push
